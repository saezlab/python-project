# pre-commit-config.yaml
# See https://pre-commit.com for docs and https://pre-commit.com/hooks.html for available hooks
#
# Hooks for the template repository itself. Everything under
# `{{cookiecutter.project_slug}}/` is a Jinja template rather than valid
# Python, YAML or TOML, so it is excluded from every content hook; the
# generated project is checked by its own `.pre-commit-config.yaml`, which the
# template self-test runs in CI.

ci:
    autofix_prs: true
    autofix_commit_msg: '[pre-commit.ci] auto fixes from pre-commit hooks'
    autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
    autoupdate_schedule: monthly
    submodules: false

exclude: ^\{\{cookiecutter\.project_slug\}\}/

repos:
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
    -   id: ruff-check
        args: [--fix, --show-fixes]
    -   id: ruff-format

-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: check-merge-conflict
    -   id: detect-private-key
    -   id: check-yaml
        args: [--unsafe]
    -   id: check-json
    -   id: end-of-file-fixer
    -   id: mixed-line-ending
        args: [--fix=lf]

    # zizmor is the static analyser for GitHub Actions workflows; its
    # configuration lives in `.github/zizmor.yml`. The `exclude` above keeps it
    # away from the workflows under `{{cookiecutter.project_slug}}/`, which are
    # Jinja templates rather than workflows.
-   repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.0
    hooks:
    -   id: zizmor
