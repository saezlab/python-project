name: Test

on:
    push:
        branches: [master, main]
    pull_request:
        branches: [master, main]
    schedule:
    -   cron: 0 5 1,15 * *
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:

    test:
        name: ${{ matrix.profile }} / Python ${{ matrix.python }} / ${{ matrix.os }}
        runs-on: ${{ matrix.os }}
        defaults:
            run:
                shell: bash -e {0}  # -e to fail on error

        # The matrix values are handed to the steps through the environment.
        # Expanding `${{ matrix.* }}` straight into a `run:` block is the
        # shell-injection pattern zizmor's `template-injection` audit is about,
        # and the habit is worth keeping even where the values are our own.
        env:
            PROJECT_NAME: ${{ matrix.project_name }}
            PROJECT_PROFILE: ${{ matrix.profile }}
            PACKAGE_NAME: ${{ matrix.package_name }}
            PYTHON_VERSION: ${{ matrix.python }}
            EXTRAS: ${{ matrix.extras }}
            INCLUDE_SECURITY_WORKFLOW: ${{ matrix.security && 'yes' || 'no' }}
            INCLUDE_MULTIVERSION_TESTING: ${{ matrix.multiversion && 'yes' || 'no' }}

        strategy:
            fail-fast: false
            # One entry per combination worth paying for rather than a full
            # cross product (SC-016 asks for all three profiles, not for all
            # three on every runner):
            #
            # - `Project Name` has a slug (`project-name`) that differs from its
            #   package name (`project_name`), `alt_name` does not; the two
            #   exercise both branches of the conditional blocks in the
            #   generated `pyproject.toml`.
            # - `security` is on in one variant and off in the others, so both
            #   the workflow itself and its removal by the post-generation hook
            #   are covered.
            # - the `package` profile is the one people will use, so it is the
            #   one tested on both the oldest and the newest supported Python
            #   and on macOS as well.
            matrix:
                include:
                -   profile: package
                    project_name: Project Name
                    package_name: project_name
                    security: true
                    extras: dev,tests,docs,typing
                    python: '3.10'
                    os: ubuntu-latest
                -   profile: package
                    project_name: Project Name
                    package_name: project_name
                    security: true
                    multiversion: true
                    extras: dev,tests,docs,typing
                    python: '3.13'
                    os: ubuntu-latest
                -   profile: package
                    project_name: Project Name
                    package_name: project_name
                    security: true
                    extras: dev,tests,docs,typing
                    python: '3.13'
                    os: macos-latest
                -   profile: workflow
                    project_name: alt_name
                    package_name: alt_name
                    security: false
                    extras: dev,tests,typing
                    python: '3.13'
                    os: ubuntu-latest
                -   profile: tiny
                    project_name: tiny_thing
                    package_name: tiny_thing
                    security: false
                    extras: dev,tests,typing
                    python: '3.13'
                    os: ubuntu-latest

        steps:
        -   name: Checkout
            uses: actions/checkout@v7
            with:
                fetch-depth: 0
                persist-credentials: false

        -   name: Install uv
            uses: astral-sh/setup-uv@v10.0.1
            with:
                enable-cache: true
                python-version: ${{ matrix.python }}

        # `cruft create` rather than plain `cookiecutter`, so that the
        # generated project carries a `.cruft.json` and the scaffold is proven
        # to be `cruft update`-compatible (SC-016).
        -   name: Instantiate the template
            run: |
                uv run --no-project --with cruft python - <<'PY'
                import os

                import cruft

                overrides = {
                    'project_name': os.environ['PROJECT_NAME'],
                    'project_profile': os.environ['PROJECT_PROFILE'],
                    'include_security_workflow': os.environ['INCLUDE_SECURITY_WORKFLOW'],
                    'include_multiversion_testing': os.environ['INCLUDE_MULTIVERSION_TESTING'],
                    'python_version': os.environ['PYTHON_VERSION'],
                }
                path = cruft.create(
                    '.',
                    checkout = os.environ['GITHUB_SHA'],
                    no_input = True,
                    extra_context = overrides,
                )

                # Every later step works in `_generated/`, so that none of them
                # has to interpolate the project slug into a shell command.
                os.rename(path, '_generated')

                print(f'Generated `{os.path.basename(path)}` in `_generated`.')
                PY

        -   name: Check the layout the profile promises
            working-directory: _generated
            run: |
                uv run --no-project python - <<'PY'
                import os
                import sys
                from pathlib import Path

                profile = os.environ['PROJECT_PROFILE']
                package = os.environ['PACKAGE_NAME']
                security = os.environ['INCLUDE_SECURITY_WORKFLOW'] == 'yes'

                # (path, present in `package`, in `workflow`, in `tiny`)
                expected = [
                    ('pyproject.toml', True, True, True),
                    ('.pre-commit-config.yaml', True, True, True),
                    ('.cruft.json', True, True, True),
                    ('tests/test_placeholder.py', True, True, True),
                    (f'{package}/py.typed', True, True, True),
                    ('.bumpversion.cfg', True, False, False),
                    ('mkdocs.yml', True, False, False),
                    ('docs/index.md', True, False, False),
                    ('docs/guide.md', True, False, False),
                    ('docs/reference', True, False, False),
                    ('docs/assets/omnipath-theme.css', True, False, False),
                    ('docs/quickstart.md', True, True, False),
                    ('.github/workflows/test.yaml', True, True, False),
                    ('.github/workflows/build.yaml', True, True, False),
                    ('.github/workflows/release.yaml', True, True, False),
                    ('.github/workflows/template-update.yaml', True, True, False),
                    ('.github/workflows/docs.yaml', True, False, False),
                    ('.codecov.yaml', True, True, False),
                    ('.github/zizmor.yml', True, True, False),
                ]
                column = {'package': 1, 'workflow': 2, 'tiny': 3}[profile]

                errors = []

                for row in expected:
                    path, wanted = row[0], row[column]
                    if Path(path).exists() is not wanted:
                        errors.append(
                            f'`{path}` should {"" if wanted else "not "}exist '
                            f'in the `{profile}` profile.',
                        )

                wanted = security and profile != 'tiny'
                if Path('.github/workflows/security.yaml').exists() is not wanted:
                    errors.append(
                        '`.github/workflows/security.yaml` does not follow '
                        '`include_security_workflow`.',
                    )

                multiversion = (
                    os.environ['INCLUDE_MULTIVERSION_TESTING'] == 'yes'
                )
                wanted = multiversion and profile != 'tiny'
                if Path('scripts').exists() is not wanted:
                    errors.append(
                        '`scripts/` does not follow '
                        '`include_multiversion_testing`.',
                    )

                for error in errors:
                    print(error, file = sys.stderr)

                sys.exit(1 if errors else 0)
                PY

        -   name: Check that the generated workflows are valid YAML
            if: matrix.profile != 'tiny'
            working-directory: _generated
            run: |
                uv run --no-project --with pyyaml python - <<'PY'
                import sys
                from pathlib import Path

                import yaml

                paths = sorted(Path('.github').rglob('*.yml'))
                paths += sorted(Path('.github').rglob('*.yaml'))

                for path in paths:
                    yaml.safe_load(path.read_text())
                    print(f'ok: {path}')

                if not paths:
                    sys.exit('No workflow or action definitions were generated.')
                PY

        -   name: Set up the pre-commit cache
            uses: actions/cache@v6
            with:
                path: ~/.cache/pre-commit
                key: pre-commit-5|${{ matrix.python }}|${{ hashFiles('_generated/.pre-commit-config.yaml') }}

        -   name: Run pre-commit
            working-directory: _generated
            run: |
                git init --quiet --initial-branch=main .
                git add -A
                uv run --no-project --with pre-commit pre-commit run \
                    --color=always --show-diff-on-failure --all-files

        -   name: Install the generated project
            working-directory: _generated
            run: |
                uv venv .venv --python "$PYTHON_VERSION"
                uv pip install --python .venv/bin/python -e ".[$EXTRAS]"

        -   name: Lint the generated project
            working-directory: _generated
            run: |
                .venv/bin/ruff check --output-format=github .
                .venv/bin/ruff format --check --diff .

        -   name: Type check the generated project
            working-directory: _generated
            run: .venv/bin/mypy

        -   name: Lint the workflows of the generated project
            if: matrix.profile != 'tiny'
            working-directory: _generated
            env:
                GH_TOKEN: ${{ github.token }}
            run: uvx zizmor .github

        -   name: Run the tests of the generated project
            working-directory: _generated
            run: .venv/bin/pytest -v

        -   name: Build the documentation of the generated project
            if: matrix.profile == 'package'
            working-directory: _generated
            run: .venv/bin/mkdocs build --strict

        -   name: Run bandit on the generated project
            if: matrix.security
            working-directory: _generated
            run: uvx --from 'bandit[toml]' bandit -c pyproject.toml -r "$PACKAGE_NAME"

        -   name: Build and check the distribution of the generated project
            working-directory: _generated
            run: |
                uv build
                uvx twine check --strict dist/*

        # The project must still consider itself up to date with the template
        # commit it was just created from, otherwise `cruft update` would offer
        # a spurious diff on day one.
        -   name: Check that the project is in sync with the template
            working-directory: _generated
            run: uv run --no-project --with cruft cruft check

    workflows:
        name: Lint the workflow definitions
        runs-on: ubuntu-latest
        steps:
        -   name: Checkout
            uses: actions/checkout@v7
            with:
                persist-credentials: false

        -   name: Install uv
            uses: astral-sh/setup-uv@v10.0.1
            with:
                enable-cache: true

        # `GH_TOKEN` turns on the audits that need the GitHub API, such as the
        # one for actions with known vulnerabilities. The workflows under
        # `{{cookiecutter.project_slug}}/` are Jinja templates rather than
        # workflows, so they are not passed to zizmor; the CI of a generated
        # project audits its own copies.
        -   name: Run zizmor
            env:
                GH_TOKEN: ${{ github.token }}
            run: uvx zizmor .github

    # Single gate to require in the branch protection rules, so that the
    # required checks do not have to be updated when the matrix changes.
    # See https://github.com/re-actors/alls-green#why
    check:
        name: All checks passed
        if: always()
        needs: [test, workflows]
        runs-on: ubuntu-latest
        steps:
        -   uses: re-actors/alls-green@v1.3.0
            with:
                jobs: ${{ toJSON(needs) }}
