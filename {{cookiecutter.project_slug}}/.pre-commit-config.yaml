# pre-commit-config.yaml
# See https://pre-commit.com for docs and https://pre-commit.com/hooks.html for available hooks

# ======================================================
# =======        pre-commit configuration       ========
# ======================================================
fail_fast: false
minimum_pre_commit_version: 3.0.0
default_language_version:
    python: python3
default_stages:
-   pre-commit
-   pre-push

# pre-commit.ci keeps the `rev`s below up to date and pushes the autofixes of
# the hooks to the pull request. Enable the repository at
# https://results.pre-commit.ci to activate it.
ci:
    autofix_prs: true
    autofix_commit_msg: '[pre-commit.ci] auto fixes from pre-commit hooks'
    autoupdate_branch: ''
    autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
    autoupdate_schedule: monthly
    submodules: false

# ======================================================
# =======            repository hooks           ========
# ======================================================
# `rev`s are updated automatically by pre-commit.ci; to do it by hand run
#   pre-commit autoupdate

repos:
    # ruff is the only linter and the only formatter for Python in this
    # project: it covers what isort, black, flake8, pyupgrade, pydocstyle,
    # blacken-docs and `check-ast` used to do here. Do not add hooks that
    # duplicate it.
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
    -   id: ruff-check
        args: [--fix, --show-fixes]
        stages: [pre-commit]
    -   id: ruff-format
        stages: [pre-commit]

    # The few general-purpose checks that ruff does not cover.
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: check-merge-conflict
        stages: [pre-commit, pre-push]
    -   id: detect-private-key
        stages: [pre-commit]
    -   id: check-yaml
        args: [--unsafe]  # mkdocs.yml uses `!!python/name:` tags
        stages: [pre-commit]
        files: \.ya?ml$
    -   id: end-of-file-fixer
        stages: [pre-commit]
    -   id: mixed-line-ending
        args: [--fix=lf]
        stages: [pre-commit]
