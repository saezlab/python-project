site_name: '{{ cookiecutter.project_name }}'
site_description: '{{ cookiecutter.short_description }}'
site_url: https://{{ cookiecutter.github_organization }}.github.io/{{ cookiecutter.project_slug }}
repo_url: {{ cookiecutter.project_repo }}
repo_name: {{ cookiecutter.github_organization }}/{{ cookiecutter.project_slug }}
edit_uri: edit/main/docs/

theme:
    name: material
    icon:
        logo: material/package-variant-closed
    font:
        text: Lato
        code: Roboto Mono
    features:
    -   content.code.copy
    -   content.action.edit
    -   navigation.instant
    -   navigation.footer
    -   navigation.top
    #  The colors live in `docs/assets/omnipath-theme.css`, the palette only
    #  selects them: `primary: custom` and `accent: custom` tell Material to
    #  read `--md-primary-fg-color` / `--md-accent-fg-color` from there.
    palette:
    -   media: '(prefers-color-scheme: light)'
        scheme: default
        primary: custom
        accent: custom
        toggle:
            icon: material/toggle-switch
            name: Switch to dark mode
    -   media: '(prefers-color-scheme: dark)'
        scheme: slate
        primary: custom
        accent: custom
        toggle:
            icon: material/toggle-switch-off
            name: Switch to light mode

extra_css:
-   assets/omnipath-theme.css

#=======    Website Navigation settings   =====
nav:
-   Home: index.md
-   Getting Started:
    -   Installation: installation.md
    -   Quick Start: quickstart.md
-   User Guide: guide.md
-   API Reference: 'reference/{{ cookiecutter.package_name }}.md'
-   Contributing: contributing.md
-   About: about.md

#=======    Extension settings (sorted alphabetically)  =====
markdown_extensions:
-   admonition
-   attr_list
-   md_in_html
  #----- Python Markdown Extensions
-   pymdownx.details
-   pymdownx.emoji:
        emoji_index: !!python/name:material.extensions.emoji.twemoji
        emoji_generator: !!python/name:material.extensions.emoji.to_svg
-   pymdownx.highlight: # Note: list of Pygments: https://pygments.org/docs/lexers/
        anchor_linenums: true
        line_spans: __span
        pygments_lang_class: true
-   pymdownx.inlinehilite
-   pymdownx.snippets
-   pymdownx.superfences:
        custom_fences:
        -   name: mermaid
            class: mermaid
            format: !!python/name:pymdownx.superfences.fence_code_format
-   pymdownx.tabbed:
        alternate_style: true

#=======    Plugins    =====
plugins:
-   search
-   mkdocstrings:
        default_handler: python
        handlers:
            python:
                options:
                    annotations_path: brief
                    docstring_style: google
                    heading_level: 3
                    modernize_annotations: true
                    show_category_heading: true
                    show_object_full_path: false
                    show_root_toc_entry: true
                    show_signature: true
                    show_signature_annotations: false
                    signature_crossrefs: true

copyright: © {{ cookiecutter.__year }} {{ cookiecutter.copyright_holder }}
