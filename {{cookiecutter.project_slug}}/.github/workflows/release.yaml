name: Release

on:
    release:
        types: [published]

# The package is published with PyPI trusted publishing, no API token is
# needed: https://docs.pypi.org/trusted-publishers/
permissions: {}

jobs:

    release:
        name: Upload the release to PyPI
        runs-on: ubuntu-latest
        environment:
            name: pypi
            url: https://pypi.org/p/{{ cookiecutter.project_slug }}
        permissions:
            contents: read
            id-token: write  # mandatory for trusted publishing
        steps:
        -   uses: actions/checkout@v7
            with:
                fetch-depth: 0
                persist-credentials: false
        -   name: Install uv
            uses: astral-sh/setup-uv@v10.0.1
            with:
                enable-cache: false
        -   name: Build the sdist and the wheel
            run: uv build
        -   name: Publish the distribution to PyPI
            uses: pypa/gh-action-pypi-publish@release/v1
