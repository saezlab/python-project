name: Security scan

on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]

concurrency:
    group: ${{ '{{' }} github.workflow {{ '}}' }}-${{ '{{' }} github.ref {{ '}}' }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:

    bandit:
        name: Bandit
        runs-on: ubuntu-latest
        steps:
        -   uses: actions/checkout@v7
            with:
                fetch-depth: 0
                persist-credentials: false
        -   name: Install uv
            uses: astral-sh/setup-uv@v10.0.1
            with:
                enable-cache: true
        -   name: Run bandit
            run: uvx --from 'bandit[toml]' bandit -c pyproject.toml -r {{ cookiecutter.package_name }}
