{%- set _all = cookiecutter._python_versions -%}
{%- set _pythons = _all[_all.index(cookiecutter.python_version):] -%}
{%- if cookiecutter.project_profile == 'workflow' -%}
{%- set _pythons = [_pythons[0], _pythons[-1]]|unique|list -%}
{%- endif -%}
{%- set _latest = _pythons[-1] -%}
name: Test

on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]
    schedule:
    -   cron: 0 5 1,15 * *
    workflow_dispatch:

concurrency:
    group: ${{ '{{' }} github.workflow {{ '}}' }}-${{ '{{' }} github.ref {{ '}}' }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:

    test:
        name: Unit tests (Python ${{ '{{' }} matrix.python-version {{ '}}' }})
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write  # for the Codecov OIDC upload
        strategy:
            fail-fast: false
            matrix:
                # Every Python this project claims to support, i.e. everything
                # from `requires-python` upwards.
                python-version: {{ _pythons|tojson }}
        steps:
        -   uses: actions/checkout@v7
            with:
                fetch-depth: 0
                persist-credentials: false
        -   uses: ./.github/actions/setup  # zizmor: ignore[self-repository]
            with:
                python-version: ${{ '{{' }} matrix.python-version {{ '}}' }}
                extras: tests
        -   name: Run the tests with coverage
            run: |
                .venv/bin/pytest --cov={{ cookiecutter.package_name }} --cov-report=xml tests/
        -   name: Upload the coverage report to Codecov
            if: matrix.python-version == '{{ _latest }}'
            uses: codecov/codecov-action@v7
            with:
                files: coverage.xml
                use_oidc: true
                fail_ci_if_error: false

    lint:
        name: Lint and format check
        runs-on: ubuntu-latest
        steps:
        -   uses: actions/checkout@v7
            with:
                fetch-depth: 0
                persist-credentials: false
        -   uses: ./.github/actions/setup  # zizmor: ignore[self-repository]
            with:
                python-version: '{{ _latest }}'
                extras: tests
        -   name: Run ruff (lint and import order)
            run: .venv/bin/ruff check --output-format=github .
        -   name: Run ruff format check
            run: .venv/bin/ruff format --check --diff .
        -   name: Lint the workflow definitions
            # `GH_TOKEN` turns on the audits that need the GitHub API, such as
            # the one for actions with known vulnerabilities.
            env:
                GH_TOKEN: ${{ '{{' }} github.token {{ '}}' }}
            run: uvx zizmor .github

    typecheck:
        name: Type check
        runs-on: ubuntu-latest
        steps:
        -   uses: actions/checkout@v7
            with:
                fetch-depth: 0
                persist-credentials: false
        -   uses: ./.github/actions/setup  # zizmor: ignore[self-repository]
            with:
                python-version: '{{ _latest }}'
                extras: typing
        -   name: Run mypy
            run: .venv/bin/mypy
{% if cookiecutter.project_profile == 'package' %}
    docs:
        name: Documentation build
        runs-on: ubuntu-latest
        steps:
        -   uses: actions/checkout@v7
            with:
                fetch-depth: 0
                persist-credentials: false
        -   uses: ./.github/actions/setup  # zizmor: ignore[self-repository]
            with:
                python-version: '{{ _latest }}'
                extras: docs
        -   name: Build the documentation
            run: .venv/bin/mkdocs build --strict
{% endif %}
    # Single gate to require in the branch protection rules, so that the
    # required checks do not have to be updated when the matrix changes.
    # See https://github.com/re-actors/alls-green#why
    check:
        name: All checks passed
        if: always()
        needs: [test, lint, typecheck{% if cookiecutter.project_profile == 'package' %}, docs{% endif %}]
        runs-on: ubuntu-latest
        steps:
        -   uses: re-actors/alls-green@v1.3.0
            with:
                jobs: ${{ '{{' }} toJSON(needs) {{ '}}' }}
