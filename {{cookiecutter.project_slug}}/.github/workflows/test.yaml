name: Test

on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]
    schedule:
    -   cron: 0 5 1,15 * *
    workflow_dispatch:

concurrency:
    group: ${{ '{{' }} github.workflow {{ '}}' }}-${{ '{{' }} github.ref {{ '}}' }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:

    test:
        name: Unit tests (Python ${{ '{{' }} matrix.python-version {{ '}}' }})
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write  # for the Codecov OIDC upload
        strategy:
            fail-fast: false
            matrix:
                python-version: ['3.10', '3.11', '3.12', '3.13']
        steps:
        -   uses: actions/checkout@v7
            with:
                fetch-depth: 0
                persist-credentials: false
        -   uses: ./.github/actions/setup
            with:
                python-version: ${{ '{{' }} matrix.python-version {{ '}}' }}
                extras: tests
        -   name: Run the tests with coverage
            run: |
                .venv/bin/pytest --cov={{ cookiecutter.package_name }} --cov-report=xml tests/
        -   name: Upload the coverage report to Codecov
            if: matrix.python-version == '3.12'
            uses: codecov/codecov-action@v7
            with:
                files: coverage.xml
                use_oidc: true
                fail_ci_if_error: false

    lint:
        name: Lint and format check
        runs-on: ubuntu-latest
        steps:
        -   uses: actions/checkout@v7
            with:
                fetch-depth: 0
                persist-credentials: false
        -   uses: ./.github/actions/setup
            with:
                python-version: '3.13'
                extras: tests
        -   name: Run ruff (lint and import order)
            run: .venv/bin/ruff check --output-format=github .
        -   name: Run ruff format check
            run: .venv/bin/ruff format --check --diff .

    docs:
        name: Documentation build
        runs-on: ubuntu-latest
        steps:
        -   uses: actions/checkout@v7
            with:
                fetch-depth: 0
                persist-credentials: false
        -   uses: ./.github/actions/setup
            with:
                python-version: '3.13'
                extras: docs
        -   name: Build the documentation
            run: .venv/bin/mkdocs build --strict

    # Single gate to require in the branch protection rules, so that the
    # required checks do not have to be updated when the matrix changes.
    # See https://github.com/re-actors/alls-green#why
    check:
        name: All checks passed
        if: always()
        needs: [test, lint, docs]
        runs-on: ubuntu-latest
        steps:
        -   uses: re-actors/alls-green@v1.3.0
            with:
                jobs: ${{ '{{' }} toJSON(needs) {{ '}}' }}
