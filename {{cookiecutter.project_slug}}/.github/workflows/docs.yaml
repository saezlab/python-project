name: Deploy documentation

on:
    push:
        branches: [main, master]
    workflow_dispatch:

# Never run two deployments to the `gh-pages` branch at the same time, but
# let a running deployment finish instead of cancelling it half way.
concurrency:
    group: ${{ '{{' }} github.workflow {{ '}}' }}
    cancel-in-progress: false

permissions:
    contents: write

jobs:

    deploy:
        name: Build and publish to GitHub Pages
        runs-on: ubuntu-latest
        steps:
        # `persist-credentials: false` everywhere else, but not here:
        # `mkdocs gh-deploy` pushes the built site to the `gh-pages` branch
        # with the credentials this checkout leaves behind.
        -   uses: actions/checkout@v7  # zizmor: ignore[artipacked]
            with:
                fetch-depth: 0
        -   name: Configure the git credentials
            run: |
                git config user.name 'github-actions[bot]'
                git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        -   uses: ./.github/actions/setup  # zizmor: ignore[self-repository]
            with:
                python-version: '{{ cookiecutter._python_versions[-1] }}'
                extras: docs
        -   name: Cache the mkdocs-material build cache
            uses: actions/cache@v6
            with:
                key: mkdocs-material-${{ '{{' }} github.run_id {{ '}}' }}
                path: .cache
                restore-keys: |
                    mkdocs-material-
        -   name: Deploy the documentation
            run: .venv/bin/mkdocs gh-deploy --force
