name: Set up Python and install the project
description: >
    Installs uv, creates a virtualenv in `.venv` and installs the project
    from `pyproject.toml` together with the requested optional dependencies.

inputs:
    python-version:
        required: true
        description: Python version to install the project with.
    extras:
        required: false
        default: dev,tests,docs
        description: >
            Comma separated optional-dependency groups to install. Pass an
            empty string to install the project without any extras.

runs:
    using: composite
    steps:
    -   name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
            enable-cache: true
            python-version: ${{ '{{' }} inputs.python-version {{ '}}' }}
    -   name: Create the virtualenv and install the project
        shell: bash
        run: |
            uv venv .venv --python '${{ '{{' }} inputs.python-version {{ '}}' }}'
            extras='${{ '{{' }} inputs.extras {{ '}}' }}'
            if [ -n "$extras" ]; then
                uv pip install --python .venv/bin/python -e ".[$extras]"
            else
                uv pip install --python .venv/bin/python -e .
            fi
